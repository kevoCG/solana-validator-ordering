<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="100%" height="100%">
  <rect width="760" height="350" fill="#0f172a" rx="8"/>
  
  <text x="210" y="32" fill="#f8fafc" font-size="16" font-weight="600" font-family="system-ui, sans-serif">
    Mean Spearman Rank Correlation (ρ) by Client Architecture
  </text>
  <text x="210" y="50" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">
    More negative ρ = stronger priority fee sorting; ρ near 0 = multi-thread / arrival order noise
  </text>

  <!-- Base axis -->
  <line x1="210" y1="55" x2="210" y2="300" stroke="#475569" stroke-width="1.5" />

  <!-- Bars -->
  
      <!-- Row: Agave -->
      <text x="192" y="88" fill="#f1f5f9" font-size="13" font-family="system-ui, sans-serif" font-weight="500" text-anchor="end">
        Agave
      </text>
      <rect x="210" y="65" width="16.8" height="36" rx="5" fill="#3b82f6" />
      <text x="238.8" y="88" fill="#e2e8f0" font-size="13" font-family="monospace" font-weight="600">
        ρ = 0.0333
      </text>
    

      <!-- Row: Jito-Solana -->
      <text x="192" y="152" fill="#f1f5f9" font-size="13" font-family="system-ui, sans-serif" font-weight="500" text-anchor="end">
        Jito-Solana
      </text>
      <rect x="210" y="129" width="20.4" height="36" rx="5" fill="#10b981" />
      <text x="242.4" y="152" fill="#e2e8f0" font-size="13" font-family="monospace" font-weight="600">
        ρ = -0.0404
      </text>
    

      <!-- Row: Frankendancer/Firedancer -->
      <text x="192" y="216" fill="#f1f5f9" font-size="13" font-family="system-ui, sans-serif" font-weight="500" text-anchor="end">
        Frankendancer/Firedancer
      </text>
      <rect x="210" y="193" width="12.0" height="36" rx="5" fill="#f59e0b" />
      <text x="234.0" y="216" fill="#e2e8f0" font-size="13" font-family="monospace" font-weight="600">
        ρ = -0.0104
      </text>
    

  <!-- Footer annotation -->
  <text x="210" y="332" fill="#64748b" font-size="11" font-family="monospace">
    Measurements on Solana Mainnet (post-Alpenglow)
  </text>
</svg>